version: '3'

services:
    miaomiao-aiflow-postgresql:
        image: postgres:18
        container_name: miaomiao-aiflow-postgresql
        ports:
            - '5435:5432'
        environment:
            - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
            - POSTGRES_DB=postgres
        volumes:
            - ./postgresql_data:/var/lib/postgresql
        # 日志控制，很重要防止服务器被日志文件爆满
        logging:
            driver: 'json-file'
            options:
                max-size: '100m'
                max-file: '3'

    # Qdrant 向量数据库
    miaomiao-aiflow-qdrant:
        image: qdrant/qdrant:latest
        container_name: miaomiao-aiflow-qdrant
        ports:
            - '6333:6333' # REST API
            - '6334:6334' # gRPC
        volumes:
            - ./qdrant_storage:/qdrant/storage
        logging:
            driver: 'json-file'
            options:
                max-size: '100m'
                max-file: '3'

networks:
    default:
        name: miaomiao-aiflow-network
        driver: bridge
