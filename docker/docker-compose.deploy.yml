# 生产部署 docker 配置（镜像分发模式）
# 用法（在仓库根目录执行，APP_IMAGE 由 CD 流水线注入）：
#   APP_IMAGE=<registry>/<namespace>/<repo>:<tag> \
#     docker compose --env-file .env -f docker/docker-compose.deploy.yml up -d
#
# 设计说明：
#   - include 引入基础设施（Postgres / Qdrant），与本地 docker-compose.yml 保持一致
#   - 应用镜像由 GitHub Actions 构建并推送到阿里云 ACR，服务器只负责 pull + run
#   - 应用容器与数据库/向量库在同一个 compose 网络内，因此生产 .env 中的
#     DATABASE_URL 应使用服务名：postgresql://USER:PASSWORD@miaomiao-aiflow-postgresql:5432/DATABASE
#     OLLAMA_BASE_URL 使用 http://host.docker.internal:11434（见下方 extra_hosts）

include:
    - 'docker-compose.yml'

services:
    # AIFlow Workflow（Next.js）应用
    miaomiao-aiflow-workflow:
        # 镜像 tag 由 CD 流水线以环境变量注入（按 git sha 固定，可回滚）
        image: ${APP_IMAGE:?Set APP_IMAGE, e.g. registry.cn-hangzhou.aliyuncs.com/ns/miaomiao-aiflow-workflow:sha-xxxx}
        container_name: miaomiao-aiflow-workflow
        # 应用运行时环境变量统一来自服务器上的 .env（敏感信息不进 Git）
        env_file:
            - ../.env
        environment:
            - NODE_ENV=production
            - PORT=3005
            - HOSTNAME=0.0.0.0
        # 应用不再直接对外暴露 3005，统一由 Caddy 反代入口（:80）转发
        extra_hosts:
            # 让容器内可以访问宿主机上运行的 Ollama
            - 'host.docker.internal:host-gateway'
        depends_on:
            - miaomiao-aiflow-postgresql
            - miaomiao-aiflow-qdrant
        restart: unless-stopped
        # 防止日志撑爆服务器磁盘
        logging:
            driver: 'json-file'
            options:
                max-size: '100m'
                max-file: '3'

    # Caddy 反向代理入口
    miaomiao-aiflow-caddy:
        image: caddy:2-alpine
        container_name: miaomiao-aiflow-caddy
        ports:
            - '80:80'
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - miaomiao-aiflow-workflow
        restart: unless-stopped
        logging:
            driver: 'json-file'
            options:
                max-size: '100m'
                max-file: '3'

volumes:
    caddy_data:
    caddy_config:
