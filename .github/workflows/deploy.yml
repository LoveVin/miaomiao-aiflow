name: CD

on:
    workflow_dispatch:

concurrency:
    group: production-deploy
    cancel-in-progress: false

jobs:
    build:
        name: Build and push image
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Aliyun ACR
              uses: docker/login-action@v3
              with:
                  registry: ${{ secrets.ACR_REGISTRY }}
                  username: ${{ secrets.ACR_USERNAME }}
                  password: ${{ secrets.ACR_PASSWORD }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  # 阿里云 ACR 个人版不支持 OCI attestations（provenance/SBOM），必须关闭
                  provenance: false
                  sbom: false
                  tags: |
                      ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_IMAGE }}:sha-${{ github.sha }}
                      ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_IMAGE }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        name: Deploy to server
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            SERVER_HOST: ${{ secrets.SERVER_HOST }}
            SERVER_USER: ${{ secrets.SERVER_USER }}
            SERVER_PORT: ${{ secrets.SERVER_PORT }}
            SERVER_PROJECT_DIR: ${{ secrets.SERVER_PROJECT_DIR }}
            SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
            SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
            APP_IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_IMAGE }}:sha-${{ github.sha }}
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up SSH
              run: |
                  set -euo pipefail

                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/deploy_key

            - name: Verify image ref
              run: |
                  echo "APP_IMAGE=$APP_IMAGE"
                  if [ -z "$APP_IMAGE" ]; then
                      echo '::error::APP_IMAGE is empty - build job outputs did not propagate' >&2
                      exit 1
                  fi
                  printf '%s\n' "$APP_IMAGE" > /tmp/app-image.txt

            - name: Sync compose files and image ref
              run: |
                  ssh -i ~/.ssh/deploy_key \
                    -p "${SERVER_PORT:-22}" \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    "$SERVER_USER@$SERVER_HOST" "mkdir -p '$SERVER_PROJECT_DIR/docker'"

                  scp -i ~/.ssh/deploy_key \
                    -P "${SERVER_PORT:-22}" \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    docker/docker-compose.yml \
                    docker/docker-compose.deploy.yml \
                    docker/caddy/Caddyfile \
                    "$SERVER_USER@$SERVER_HOST:$SERVER_PROJECT_DIR/docker/"

                  scp -i ~/.ssh/deploy_key \
                    -P "${SERVER_PORT:-22}" \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    /tmp/app-image.txt \
                    "$SERVER_USER@$SERVER_HOST:$SERVER_PROJECT_DIR/docker/app-image.txt"

            - name: Log server in to Aliyun ACR
              env:
                  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
                  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
                  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
              run: |
                  # base64 编码传输，避免密码被两端 shell 二次解析或出现在 ps 中
                  ACR_PASSWORD_B64=$(printf '%s' "$ACR_PASSWORD" | base64 | tr -d '\n')

                  ssh -i ~/.ssh/deploy_key \
                    -p "${SERVER_PORT:-22}" \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    "$SERVER_USER@$SERVER_HOST" "printf '%s' '$ACR_PASSWORD_B64' | base64 -d | docker login '$ACR_REGISTRY' --username '$ACR_USERNAME' --password-stdin"

            - name: Pull image, migrate and start services
              run: |
                  ssh -i ~/.ssh/deploy_key \
                    -p "${SERVER_PORT:-22}" \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    -o ServerAliveInterval=30 \
                    "$SERVER_USER@$SERVER_HOST" bash -s <<REMOTE
                  set -euo pipefail
                  cd '$SERVER_PROJECT_DIR'
                  APP_IMAGE="\$(cat docker/app-image.txt)"
                  if [ -z "\$APP_IMAGE" ]; then
                      echo '==> Error: docker/app-image.txt is empty' >&2
                      exit 1
                  fi
                  export APP_IMAGE
                  echo "==> Image: \$APP_IMAGE"
                  COMPOSE="docker compose -p miaomiao-aiflow --env-file .env -f docker/docker-compose.deploy.yml"

                  echo '==> Pull image' \
                      \$APP_IMAGE
                  \$COMPOSE pull miaomiao-aiflow-workflow

                  echo '==> Run database migrations'
                  \$COMPOSE run --rm miaomiao-aiflow-workflow \
                      node_modules/.bin/prisma migrate deploy --config prisma7.config.ts

                  echo '==> Start / update services'
                  \$COMPOSE up -d

                  echo '==> Wait for health check'
                  for i in \$(seq 1 10); do
                      if curl -fsS --max-time 10 http://127.0.0.1:3005/login >/dev/null; then
                          echo '==> Deploy success'
                          exit 0
                      fi
                      sleep 3
                  done

                  echo '==> Health check failed' >&2
                  \$COMPOSE logs --tail=100 >&2
                  exit 1
                  REMOTE
