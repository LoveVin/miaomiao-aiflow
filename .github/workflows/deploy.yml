name: CD

on:
    workflow_dispatch:

concurrency:
    group: production-deploy
    cancel-in-progress: false

jobs:
    build:
        name: Build and push image
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Aliyun ACR
              uses: docker/login-action@v3
              with:
                  registry: ${{ secrets.ACR_REGISTRY }}
                  username: ${{ secrets.ACR_USERNAME }}
                  password: ${{ secrets.ACR_PASSWORD }}

            - name: Build and push image
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  # 阿里云 ACR 个人版不支持 OCI attestations（provenance/SBOM），必须关闭
                  provenance: false
                  sbom: false
                  tags: |
                      ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_IMAGE }}:sha-${{ github.sha }}
                      ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_IMAGE }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        name: Deploy to server
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            SERVER_HOST: ${{ secrets.SERVER_HOST }}
            SERVER_USER: ${{ secrets.SERVER_USER }}
            SERVER_PORT: ${{ secrets.SERVER_PORT }}
            SERVER_PROJECT_DIR: ${{ secrets.SERVER_PROJECT_DIR }}
            SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
            SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
            # 使用本次构建的不可变 digest，避免同一 commit 重跑时 sha 标签被覆盖。
            APP_IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_IMAGE }}@${{ needs.build.outputs.digest }}
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up SSH
              run: |
                  set -euo pipefail

                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/deploy_key

            - name: Verify image ref
              run: |
                  set -euo pipefail
                  echo "APP_IMAGE=$APP_IMAGE"
                  if [[ ! "$APP_IMAGE" =~ ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ ]]; then
                      echo '::error::APP_IMAGE must contain the digest from this build' >&2
                      exit 1
                  fi
                  printf '%s\n' "$APP_IMAGE" > /tmp/app-image.txt

            - name: Sync compose files and image ref
              run: |
                  # 旧部署缺少挂载源时，Docker 可能把 Caddyfile 创建成空目录。
                  # rmdir 只修复空目录；非空目录会报错并停止部署，避免覆盖未知文件。
                  ssh -i ~/.ssh/deploy_key \
                    -p "${SERVER_PORT:-22}" \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    "$SERVER_USER@$SERVER_HOST" \
                    "mkdir -p '$SERVER_PROJECT_DIR/docker/caddy' && \
                     if [ -d '$SERVER_PROJECT_DIR/docker/caddy/Caddyfile' ]; then \
                         rmdir '$SERVER_PROJECT_DIR/docker/caddy/Caddyfile'; \
                     fi"

                  scp -i ~/.ssh/deploy_key \
                    -P "${SERVER_PORT:-22}" \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    docker/docker-compose.yml \
                    docker/docker-compose.deploy.yml \
                    "$SERVER_USER@$SERVER_HOST:$SERVER_PROJECT_DIR/docker/"

                  scp -i ~/.ssh/deploy_key \
                    -P "${SERVER_PORT:-22}" \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    docker/caddy/Caddyfile \
                    "$SERVER_USER@$SERVER_HOST:$SERVER_PROJECT_DIR/docker/caddy/Caddyfile"

                  scp -i ~/.ssh/deploy_key \
                    -P "${SERVER_PORT:-22}" \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    /tmp/app-image.txt \
                    "$SERVER_USER@$SERVER_HOST:$SERVER_PROJECT_DIR/docker/app-image.txt"

            - name: Log server in to Aliyun ACR
              env:
                  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
                  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
                  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
              run: |
                  # base64 编码传输，避免密码被两端 shell 二次解析或出现在 ps 中
                  ACR_PASSWORD_B64=$(printf '%s' "$ACR_PASSWORD" | base64 | tr -d '\n')

                  ssh -i ~/.ssh/deploy_key \
                    -p "${SERVER_PORT:-22}" \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    "$SERVER_USER@$SERVER_HOST" "printf '%s' '$ACR_PASSWORD_B64' | base64 -d | docker login '$ACR_REGISTRY' --username '$ACR_USERNAME' --password-stdin"

            - name: Pull image, migrate and start services
              run: |
                  ssh -i ~/.ssh/deploy_key \
                    -p "${SERVER_PORT:-22}" \
                    -o BatchMode=yes \
                    -o IdentitiesOnly=yes \
                    -o StrictHostKeyChecking=yes \
                    -o ServerAliveInterval=30 \
                    "$SERVER_USER@$SERVER_HOST" bash -s <<REMOTE
                  set -euo pipefail
                  cd '$SERVER_PROJECT_DIR'
                  APP_IMAGE="\$(cat docker/app-image.txt)"
                  if [ -z "\$APP_IMAGE" ]; then
                      echo '==> Error: docker/app-image.txt is empty' >&2
                      exit 1
                  fi
                  export APP_IMAGE
                  echo "==> Image: \$APP_IMAGE"
                  COMPOSE="docker compose -p miaomiao-aiflow --env-file .env -f docker/docker-compose.deploy.yml"

                  echo '==> Pull image' \
                      \$APP_IMAGE
                  \$COMPOSE pull miaomiao-aiflow-workflow
                  EXPECTED_IMAGE_ID="\$(docker image inspect --format '{{.Id}}' "\$APP_IMAGE")"
                  echo "==> Expected image ID: \$EXPECTED_IMAGE_ID"
                  # digest 拉取不会创建 sha 标签；补上本地标签，供保留最近两版镜像的清理逻辑使用。
                  docker tag "\$APP_IMAGE" "\${APP_IMAGE%@*}:sha-${{ github.sha }}"

                  echo '==> Run database migrations'
                  \$COMPOSE run --rm miaomiao-aiflow-workflow \
                      node_modules/.bin/prisma migrate deploy --config prisma7.config.ts

                  echo '==> Check for stale app container not owned by this compose project'
                  # 历史遗留：早期部署可能用其它 compose 项目名/方式创建了同名容器。
                  # 由于 compose 文件固定了 container_name，当前项目 up -d 会因名字冲突失败，
                  # 旧容器一直占着名字不被替换，页面始终是旧版本。
                  # 这里把不属于 miaomiao-aiflow 项目的同名容器删掉，让 up -d 能正常重建。
                  STALE_CONTAINER="\$(docker ps -a --format '{{.Names}}\t{{.Label "com.docker.compose.project"}}' \
                      | awk -F '\t' '\$1 == "miaomiao-aiflow-workflow" && \$2 != "miaomiao-aiflow" {print \$1}')"
                  if [ -n "\$STALE_CONTAINER" ]; then
                      echo "==> Removing stale container: \$STALE_CONTAINER"
                      docker rm -f "\$STALE_CONTAINER" >/dev/null
                  else
                      echo '==> No stale container found'
                  fi

                  echo '==> Current app container state'
                  docker ps -a --filter 'name=^/miaomiao-aiflow-workflow$' \
                      --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Label "com.docker.compose.project"}}' || true

                  echo '==> Start / update services (force-recreate: pick up newly pulled image)'
                  # 同步更新应用和对外入口，确保 Caddy 使用本次同步的配置。
                  # --no-deps 避免强制重建 Postgres / Qdrant；迁移步骤已启动这些依赖。
                  \$COMPOSE up -d --no-deps --force-recreate miaomiao-aiflow-workflow miaomiao-aiflow-caddy

                  echo '==> Verify running container image'
                  RUNNING_IMAGE="\$(docker inspect --format '{{.Config.Image}}' miaomiao-aiflow-workflow)"
                  RUNNING_IMAGE_ID="\$(docker inspect --format '{{.Image}}' miaomiao-aiflow-workflow)"
                  echo "==> Running container image: \$RUNNING_IMAGE"
                  echo "==> Running container image ID: \$RUNNING_IMAGE_ID"
                  if [ "\$RUNNING_IMAGE" != "\$APP_IMAGE" ] || [ "\$RUNNING_IMAGE_ID" != "\$EXPECTED_IMAGE_ID" ]; then
                      echo '==> Error: running container did not switch to the new image' >&2
                      exit 1
                  fi

                  echo '==> Wait for health check'
                  HEALTHY=0
                  for i in \$(seq 1 10); do
                      if curl -fsS --max-time 10 http://127.0.0.1:3005/login >/dev/null; then
                          HEALTHY=1
                          break
                      fi
                      sleep 3
                  done

                  if [ "\$HEALTHY" != "1" ]; then
                      echo '==> Health check failed' >&2
                      \$COMPOSE logs --tail=100 >&2
                      exit 1
                  fi

                  echo '==> Deploy success'

                  echo '==> Prune old app images (keep the two newest)'
                  # 镜像 tag 为 sha-<git sha>；按创建时间倒序只保留最近两个，更早的删除，
                  # 避免每次 CD 都 pull 新镜像导致服务器磁盘上镜像越积越多。
                  APP_REPO="\${APP_IMAGE%@*}"
                  NEWEST_TWO="\$(docker image ls --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' "\$APP_REPO" | sort -r | awk -F '\t' '\$2 ~ /:sha-/ && ++n <= 2 {print \$2}')"
                  for img in \$(docker image ls --format '{{.Repository}}:{{.Tag}}' "\$APP_REPO" | awk '/:sha-/'); do
                      if ! printf '%s\n' "\$NEWEST_TWO" | grep -Fx "\$img" >/dev/null; then
                          echo "==> Removing old image: \$img"
                          docker rmi "\$img" >/dev/null || true
                      fi
                  done
                  # 清理 pull 中断等产生的无标签悬空镜像
                  docker image prune -f >/dev/null || true

                  exit 0
                  REMOTE
